name: CROSSRULE quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pinned-cli:
    name: Pinned GenLayer CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm StudioNet compatible CLI
        run: npm run genlayer -- --version

  contract-offline:
    name: Offline contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Source regression suite
        run: python -m unittest discover -s tests -p test_contract_offline.py -v
      - name: Contract source compiles
        run: python -m py_compile contracts/Crossrule.py

  contract-genvm:
    name: GenVM lint + Direct Mode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned GenLayer test tools
        run: python -m pip install genlayer-test==0.29.2 genvm-linter==0.11.0
      - name: Prepare pinned GenVM runner for linter compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          from gltest.direct.sdk_loader import setup_sdk_paths

          paths = setup_sdk_paths(Path("contracts/Crossrule.py"), "v0.2.16")
          std = next(path for path in paths if "py-lib-genlayer-std" in str(path))
          target = Path(".genvmroot/runners/py-lib-genlayer-std/src")
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(std, target, dirs_exist_ok=True)
          print(f"Prepared {std} -> {target}")
          PY
          echo "GENVMROOT=$GITHUB_WORKSPACE/.genvmroot" >> "$GITHUB_ENV"
      - name: Lint actual intelligent contract
        run: genvm-lint check contracts/Crossrule.py
      - name: Verify canonical contract bytes
        run: node scripts/verify_source_parity.mjs contracts/Crossrule.py
      - name: Run GenVM Direct Mode lifecycle tests
        run: python -m pytest tests/direct -q

  frontend:
    name: Web quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Public UI browser flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_CROSSRULE_CONTRACT_ADDRESS: '0x673aF6595dA79799D86A8C0467D51088d9C935d4'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mutation:
    name: Security mutation checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test tools
        run: python -m pip install pytest==8.4.2 genlayer-test==0.29.2
      - name: Kill high-risk mutations
        run: python -m pytest tests/mutation -q

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Root production dependency audit
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Frontend production dependency audit
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        shell: bash
        run: |
          npm audit --json > root-audit.json || true
          (cd frontend && npm audit --json > ../frontend-audit.json || true)
          python - <<'PY'
          import json
          for name in ("root-audit.json", "frontend-audit.json"):
              with open(name, encoding="utf-8") as handle:
                  data = json.load(handle)
              print(f"{name}: {data.get('metadata', {}).get('vulnerabilities', {})}")
          PY
      - name: Scan tracked source for common secret formats
        shell: bash
        run: |
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----' -- ':!*.lock'; then
            echo 'Potential credential material found in tracked source.'
            exit 1
          fi
          echo 'No common credential formats found.'
