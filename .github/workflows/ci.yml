name: CROSSRULE quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pinned-cli:
    name: Pinned GenLayer CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm StudioNet compatible CLI
        run: npm run genlayer -- --version

  contract-offline:
    name: Offline contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source regression suite
        run: python -m unittest discover -s tests -p test_contract_offline.py -v
      - name: Contract source compiles
        run: python -m py_compile contracts/Crossrule.py

  contract-genvm:
    name: GenVM lint + Direct Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GenLayer test tools
        run: python -m pip install genlayer-test==0.29.2 genvm-linter==0.11.0
      - name: Lint actual intelligent contract and fetch runner artifact
        run: genvm-lint check contracts/Crossrule.py
      - name: Reuse GenVM artifact with older Direct Mode runner
        shell: bash
        run: |
          mkdir -p "$HOME/.cache/gltest-direct"
          cp -n "$HOME"/.cache/genvm-linter/genvm-universal-*.tar.xz "$HOME/.cache/gltest-direct/"
      - name: Run GenVM Direct Mode lifecycle tests
        run: python -m pytest tests/direct -q

  frontend:
    name: Web quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Public UI browser flow
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
